# Throwaway Nextcloud for the version matrix of phase 25 (tag query spike, 32 to 34).
#
#   export NC_SPIKE_TAG=32.0.15-apache
#   export NC_SPIKE_ADMIN_PASSWORD="<generated by scripts/tag_spike.py, never written down>"
#   docker compose -f compose.spike-tags.yml up -d --wait
#   docker compose -f compose.spike-tags.yml down -v
#
# down -v is mandatory between versions, otherwise the next tag runs an upgrade
# (RESEARCH Pitfall 3): a 33 started on the volume of a 32 upgrades that instance
# instead of installing a fresh one, and the measurement then belongs to an upgraded
# instance, not to a release.
#
# Official image instead of nextcloud-docker-dev: docker-dev clones a server branch at
# runtime and does not measure a release (D-25-01 discretion). The image tag is a
# required variable without a default, so every run names the patch release it measured;
# the version of record is still `occ status`, never this file.
#
# Throwaway, loopback only, never run two of these at once (D-25-01): the Docker VM has
# 7.6 GiB and the nc35 topology keeps running next to this instance.
#
# It is a copy of compose.test.yml with four differences and nothing else:
#
#   1. Its own project name, container name and volume, so nothing of the test instance
#      of compose.test.yml (port 8080) is touched.
#   2. The image tag is the required variable NC_SPIKE_TAG.
#   3. The loopback port is 8083, fixed: free next to 8080 (test instance) and 8082
#      (nc35), measured on 2026-09-26.
#   4. The admin password is the required variable NC_SPIKE_ADMIN_PASSWORD. There is no
#      fixed password in this file; the measuring script generates one per run and hands
#      it over through the environment of the compose call only.
name: nc-mcp-spike-tags

services:
  nextcloud:
    image: "nextcloud:${NC_SPIKE_TAG:?set NC_SPIKE_TAG, e.g. 32.0.15-apache}"
    container_name: nc-spike-tags
    ports:
      # Loopback only (WR-06): the bruteforce guard of a throwaway instance is switched
      # off, and a LAN wide binding would expose a trivially ownable instance.
      - "127.0.0.1:8083:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: "${NC_SPIKE_ADMIN_PASSWORD:?set NC_SPIKE_ADMIN_PASSWORD}"
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1"
    healthcheck:
      # status.php answers as soon as the web server is up. That is not the same as
      # "installed", so the measuring script polls `occ status` before it does any work.
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://localhost/status.php') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 40
    volumes:
      - nc-spike-tags-data:/var/www/html

volumes:
  nc-spike-tags-data:
