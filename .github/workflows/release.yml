#
# Publish a release of the olivia fork: rename the app id to mcp_connector_olivia
# (scripts/olivia-rename.sh), run the test suite against the renamed tree, build the
# multi arch image and push it to ghcr.io under that id, tagged with info.xml
# <image-tag>, then attach the renamed info.xml to the GitHub release. There is no
# store archive here: this fork installs next to the upstream app from ghcr.io, it
# is not submitted to the Nextcloud app store.
#
# Two ways in:
#   - push a tag v<image-tag>: the real release, renames, tests, builds, pushes and
#     publishes.
#   - run it by hand (workflow_dispatch) with dry_run=true (the default): renames,
#     tests, builds the multi arch image WITHOUT pushing and WITHOUT a release, so
#     the workflow itself can be tested without publishing anything.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not push the image or publish a release"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Decide dry run and image tag
        id: cfg
        run: |
          image_tag="$(grep -oP '(?<=<image-tag>)[^<]+' appinfo/info.xml)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$image_tag" ]]; then
              echo "tag $tag does not match info.xml <image-tag> $image_tag" >&2
              exit 1
            fi
            echo "dry=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$image_tag" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Rename the app id for the olivia fork
        run: scripts/olivia-rename.sh && scripts/olivia-check-rename.sh

      - name: Tests on the renamed tree
        run: uv sync --frozen && uv run pytest tests/unit tests/contract

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: ${{ steps.cfg.outputs.dry == 'false' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the multi arch image (push only on a real release)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.dry == 'false' }}
          tags: ghcr.io/${{ github.repository_owner }}/mcp_connector_olivia:${{ steps.cfg.outputs.version }}

      - name: Publish the renamed info.xml with the release
        if: ${{ steps.cfg.outputs.dry == 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          files: appinfo/info.xml
