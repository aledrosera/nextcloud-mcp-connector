# Local HaRP topology for the real ExApp installation (D-31).
#
#   docker compose -f compose.exapp.yml up -d --wait   # start and wait for healthy
#   bash scripts/bootstrap_exapp.sh                    # AppAPI, daemon, image, ExApp
#   docker compose -f compose.exapp.yml down           # stop, keep the data volume
#   docker compose -f compose.exapp.yml down -v        # stop and throw the data away
#
# This is a second and independent topology next to compose.test.yml, not an extension of
# it. It carries its own project name, its own volume, its own network and its own port,
# so the instance from compose.test.yml keeps running untouched while this one is created,
# used and thrown away.
#
# The credentials below are throwaway values for an instance that only ever listens on
# loopback. They are not a deployment secret; the shared key and the app secret of the
# registration are generated at bootstrap time and land in .env.exapp, which is
# git-ignored.
name: nc-mcp-exapp

services:
  caddy:
    # AppAPI reaches an ExApp through the public Nextcloud URL, so a reverse proxy that
    # knows /exapps/* is not decoration here: without it the registration fails at the
    # heartbeat (02-RESEARCH.md, pitfall 7). Nextcloud AIO ships exactly this rule.
    image: caddy:2
    container_name: nc-mcp-exapp-caddy
    ports:
      # Loopback only (WR-06): the admin password below is a throwaway value and the
      # bruteforce guard is disabled at bootstrap, so a 0.0.0.0 binding would expose a
      # trivially ownable instance to the developer's or the runner's LAN.
      - "127.0.0.1:${NC_EXAPP_PORT:-8081}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        # A fixed address, because Nextcloud and HaRP have to trust exactly this one
        # container and nothing else in the subnet (WR-08). The ExApp container is hung
        # into the same network by the deploy daemon, and it is the component that
        # processes untrusted input: it must never be able to rewrite a client address.
        ipv4_address: 172.29.42.10
    depends_on:
      nextcloud:
        condition: service_healthy
    restart: unless-stopped

  nextcloud:
    # A patch version and not the floating tag 34-apache, because a floating tag makes
    # every version claim about this instance unverifiable: on 2026-08-20 the local image
    # under 34-apache was built on the 5th of August and carried 34.0.2.1, while the tag on
    # Docker Hub had moved to 34.0.3 on the 17th, and Docker does not pull a moved tag
    # without being asked. A measurement of a version specific behaviour (EXAPP-06, the
    # store interface fixed upstream in 34.0.3) then reads the wrong instance and nobody
    # notices. The version of record is `occ status`, never this line.
    #
    # The default stays 34.0.3 because EXAPP-06 is measured on it. The only override in this
    # repository is the CI job canary-nc35, which points NC_EXAPP_NEXTCLOUD_IMAGE at the
    # official nextcloud:35.0.1-apache for the canary and pair proofs (owner decision WR-04,
    # 2026-09-30). Any override must again be a patch version, never a floating tag.
    image: "${NC_EXAPP_NEXTCLOUD_IMAGE:-nextcloud:34.0.3-apache}"
    container_name: nc-mcp-exapp-nc
    # No published port on purpose: this instance is reachable through Caddy only, because
    # every request from AppAPI to the ExApp has to take the same way a browser takes.
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: "${NC_EXAPP_ADMIN_USER:-admin}"
      NEXTCLOUD_ADMIN_PASSWORD: "${NC_EXAPP_ADMIN_PASSWORD:-admin-exapp-pw}"
      # caddy is in the list because the deploy daemon calls Nextcloud under that name
      # from inside the network, and Nextcloud rejects an unknown Host outright.
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 caddy"
      # AppAPI builds the ExApp URL from the public Nextcloud URL, so Nextcloud has to
      # know what it is called from the outside (02-RESEARCH.md, pitfall 7). Without the
      # overwrite it would generate http://caddy links and occ would print them, too.
      OVERWRITEHOST: "127.0.0.1:${NC_EXAPP_PORT:-8081}"
      OVERWRITEPROTOCOL: http
      OVERWRITECLIURL: "http://127.0.0.1:${NC_EXAPP_PORT:-8081}"
      # Only the proxy in front of it may rewrite the client address, and that is one
      # container, not the subnet (WR-08). The whole /24 also covered the ExApp container,
      # which would have let anything running in there forge client IPs towards Nextcloud:
      # bruteforce counters, audit entries and IP based rules all read that value. The
      # address is the fixed one assigned to caddy above.
      TRUSTED_PROXIES: "172.29.42.10"
    healthcheck:
      # status.php answers as soon as the web server is up. That is not the same as
      # "installed", so the bootstrap script polls `occ status` before it does any work.
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://localhost/status.php') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 40
    volumes:
      - nextcloud-exapp-data:/var/www/html
    restart: unless-stopped

  appapi-harp:
    # The deploy daemon. It starts the ExApp container over the Docker socket and routes
    # every /exapps/ request to it, past the PHP process (research: HaRP is the
    # recommended daemon from Nextcloud 32 on, the Docker Socket Proxy is deprecated).
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release
    container_name: nc-mcp-exapp-harp
    # No ports section: Caddy reaches 8780 inside this network, and publishing the port
    # would weaken the WR-06 rule without buying anything.
    environment:
      # No default (WR-11). The old one was a fixed string in a public repository, and it
      # was used by exactly the command the documentation gives, so nobody ever saw it: the
      # bootstrap reads the key back from this container and writes it into .env.exapp,
      # where it looks like a generated value. Whoever reaches the FRP port with it can
      # register as this ExApp. `up` now fails until the operator generates one:
      #   export HP_SHARED_KEY="$(openssl rand -hex 32)"
      # Reading it back rather than guessing it stays right: the daemon registration can
      # never drift away from the container that was started before the bootstrap ran.
      HP_SHARED_KEY: "${HP_SHARED_KEY:?export HP_SHARED_KEY with 64 hex characters first, see .env.exapp.example}"
      NC_INSTANCE_URL: "http://caddy"
      # One proxy, not the subnet: see the TRUSTED_PROXIES comment above (WR-08).
      HP_TRUSTED_PROXY_IPS: "172.29.42.10"
      # The image defaults to "warning", which hides the one line that says where a
      # request was routed. HP_LOG_LEVEL=info in the environment makes a failing
      # registration debuggable without editing this file.
      HP_LOG_LEVEL: "${HP_LOG_LEVEL:-warning}"
    volumes:
      # T-02-31, accepted: the Docker socket is effectively root on the host. The deploy
      # daemon cannot create the ExApp container without it. This topology listens on
      # loopback only and is stopped after the test; docs/exapp-install.md carries the
      # production note.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.harp-certs:/certs
    depends_on:
      nextcloud:
        condition: service_healthy
    restart: unless-stopped

  greenmail:
    # An IMAP and SMTP server for the mail account of alice, added in plan 10-01. The field
    # shapes of the Mail app cannot be measured without real IMAP data: `specialRole`,
    # `previewText`, the filter grammar and the length of a converted HTML body (A1 to A4 in
    # 10-RESEARCH.md) are decidable against real messages only, and MAIL-03 asks literally for
    # "documented the way it was tested". Before this service the spike account pointed at
    # imap.invalid, which was enough to prove reachability (MAIL-04) and nothing beyond it.
    #
    # This service belongs to the throwaway topology of this repository and never to an
    # installation. It accepts mail without any authentication and it stores everything in
    # memory.
    image: greenmail/standalone:2.1.12
    container_name: nc-mcp-exapp-greenmail
    # No ports section, for the same reason the registry service gives: Nextcloud reaches
    # GreenMail over the network nc-mcp-exapp-net under the service name, and a published port
    # would be reach without any gain (T-08-05, T-10-01). The test mails are delivered from a
    # throwaway container inside the same network, see deliver_mail in
    # scripts/bootstrap_exapp.sh.
    environment:
      # The user password is interpolated from the same variable scripts/bootstrap_exapp.sh
      # reads for ALICE_IMAP_PASSWORD, including the same default, so the two places cannot
      # drift apart: a mismatch would produce an account that authenticates nowhere and a
      # measurement that reads the error path instead of the field shapes.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.users=alice:${NC_EXAPP_ALICE_IMAP_PASSWORD:-alice-spike-imap-pw}@example.test
    restart: unless-stopped

  registry:
    # The ExApp image is not published before phase 5 (D-25), but the deploy daemon can
    # only pull what a registry serves. It uses the Docker daemon of the host, and that
    # daemon treats 127.0.0.1:5000 as an allowed insecure registry without any extra
    # configuration. Without this service the container deploy would have nothing to pull.
    image: registry:2
    container_name: nc-mcp-exapp-registry
    ports:
      # Loopback only (WR-06): an unauthenticated, unencrypted registry on 0.0.0.0 is an
      # open write target for everyone on the same network.
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-exapp-data:/var/lib/registry
    restart: unless-stopped

networks:
  default:
    # Named explicitly because `occ app_api:daemon:register --net` needs the name, and a
    # fixed subnet because both the Nextcloud proxy list and HaRP have to trust exactly
    # this range and nothing wider.
    name: nc-mcp-exapp-net
    ipam:
      config:
        - subnet: 172.29.42.0/24
          # Dynamic assignment never enters the static half (IN-03): without the range,
          # Docker could hand the fixed proxy address 172.29.42.10 to any other container
          # once caddy is down, including the ExApp container the daemon creates, which
          # would make the component that processes untrusted input a trusted proxy.
          ip_range: 172.29.42.128/25

volumes:
  nextcloud-exapp-data:
  registry-exapp-data:
