# Throwaway Nextcloud 35 plus PostgreSQL 17 for the counter measurement of phase 25
# (plan 25-05, owner decision D-25-05: does "one REPORT per answer" hold on a production
# database, or is the tag check at the answer nodes plus their ancestors cheaper).
#
#   export NC_SPIKE_TAG=35.0.0-apache-local
#   export NC_SPIKE_ADMIN_PASSWORD="<generated by scripts/tag_spike.py, never written down>"
#   export NC_SPIKE_DB_PASSWORD="<generated by scripts/tag_spike.py, never written down>"
#   docker compose -f compose.spike-tags-pg.yml up -d --wait
#   docker compose -f compose.spike-tags-pg.yml down -v
#
# down -v is mandatory after every run: a second run on the old volumes would measure an
# instance that already carries the data and the ballast of the first one.
#
# A file of its own next to compose.spike-tags.yml, not a variant inside it: the entrypoint
# of the official image evaluates SQLITE_DATABASE before POSTGRES_*, and the matrix of plan
# 25-03 has to stay reproducible unchanged.
#
# Throwaway, loopback only, never run two of these (or this and compose.spike-tags.yml) at
# once: the Docker VM has 7.6 GiB and the nc35 topology keeps running next to this pair.
# The database has no ports entry at all, it is only reachable inside the compose network.
#
# There is no fixed password in this file. Both passwords are required variables without a
# default; the measuring script generates them per run and hands them over through the
# environment of the compose call only.
name: nc-mcp-spike-tags-pg

services:
  db:
    image: postgres:17-alpine
    container_name: nc-spike-tags-pgdb
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${NC_SPIKE_DB_PASSWORD:?set NC_SPIKE_DB_PASSWORD}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nextcloud", "-d", "nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 1g
    volumes:
      - nc-spike-tags-pgdb-data:/var/lib/postgresql/data

  nextcloud:
    image: "nextcloud:${NC_SPIKE_TAG:?set NC_SPIKE_TAG, e.g. 35.0.0-apache-local}"
    container_name: nc-spike-tags-pg
    ports:
      # Loopback only (WR-06): the bruteforce guard of a throwaway instance is switched
      # off, and a LAN wide binding would expose a trivially ownable instance.
      - "127.0.0.1:8083:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: "${NC_SPIKE_DB_PASSWORD:?set NC_SPIKE_DB_PASSWORD}"
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: "${NC_SPIKE_ADMIN_PASSWORD:?set NC_SPIKE_ADMIN_PASSWORD}"
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # status.php answers as soon as the web server is up. That is not the same as
      # "installed", so the measuring script polls `occ status` before it does any work.
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://localhost/status.php') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 2g
    volumes:
      - nc-spike-tags-pg-data:/var/www/html

volumes:
  nc-spike-tags-pgdb-data:
  nc-spike-tags-pg-data:
